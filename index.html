<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arca</title>
<meta name="description" content="Arca prototype: spending envelopes, commitment mode and gentle friction. Fictional data; no real cards or money.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arca">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B2F55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized app column, centered on larger screens; content scrolls inside, tab bar fixed at the bottom of the device. */
:root {
  --page: #E6E2D9;
  --bg: #F5F2EC;
  --surface: #FFFDF9;
  --surface-2: #EDE9E1;
  --ink: #15243D;
  --ink-2: #4C5A6F;
  --ink-3: #7A8596;
  --line: #E1DCD2;
  --primary: #1C3157;
  --on-primary: #F5F2EC;
  --teal: #4A8984;
  --teal-ink: #2D6662;
  --teal-soft: #DCEAE6;
  --pending: #9DBDB8;
  --ok: #3C7F62;
  --warn: #9A6A2A;
  --warn-soft: #F3E8D6;
  --stop: #94503F;
  --stop-soft: #F2E2DC;
  --hero-a: #1B2F55;
  --hero-b: #2C5872;
  --hero-c: #6A9C94;
  --hill-1: #8DB6AC;
  --hill-2: #4E837E;
  --hill-3: #2B5464;
  --on-hero: #F7F4EE;
  --m1: #2C5872; --m2: #4A8984; --m3: #7C6A9A; --m4: #A0714A;
  --shadow: 0 1px 2px rgba(21, 36, 61, .05), 0 10px 30px rgba(21, 36, 61, .08);
  --display: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --body: 'Figtree', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --r-lg: 26px; --r-md: 18px; --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #080E19; --bg: #0F1828; --surface: #162238; --surface-2: #1D2B44; --ink: #ECEFF3; --ink-2: #AEB8C7; --ink-3: #7F8BA0; --line: #26354F;
    --primary: #8CC3BC; --on-primary: #0F1828; --teal: #7DB9B2; --teal-ink: #9CD0C9; --teal-soft: #1C3A3C; --pending: #3F6B68;
    --ok: #79C2A0; --warn: #D9A65E; --warn-soft: #3A2F1E; --stop: #E0917F; --stop-soft: #3C2420;
    --hero-a: #0B1630; --hero-b: #173A52; --hero-c: #2F6463; --hill-1: #3B6C68; --hill-2: #24504F; --hill-3: #142F3E; --on-hero: #EEF1F2;
    --m1: #6E9BC0; --m2: #7DB9B2; --m3: #A99BCB; --m4: #D2A37A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #080E19; --bg: #0F1828; --surface: #162238; --surface-2: #1D2B44; --ink: #ECEFF3; --ink-2: #AEB8C7; --ink-3: #7F8BA0; --line: #26354F;
  --primary: #8CC3BC; --on-primary: #0F1828; --teal: #7DB9B2; --teal-ink: #9CD0C9; --teal-soft: #1C3A3C; --pending: #3F6B68;
  --ok: #79C2A0; --warn: #D9A65E; --warn-soft: #3A2F1E; --stop: #E0917F; --stop-soft: #3C2420;
  --hero-a: #0B1630; --hero-b: #173A52; --hero-c: #2F6463; --hill-1: #3B6C68; --hill-2: #24504F; --hill-3: #142F3E; --on-hero: #EEF1F2;
  --m1: #6E9BC0; --m2: #7DB9B2; --m3: #A99BCB; --m4: #D2A37A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0; -webkit-text-size-adjust: 100%;
  background: var(--page); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding-inline: 16px; padding-block: 16px; box-sizing: border-box; -webkit-font-smoothing: antialiased;
}
*, *::before, *::after { box-sizing: border-box; }
#root { width: min(100%, 410px); height: min(100%, 860px); }
.caption-out { color: var(--ink-3); font-size: 12px; letter-spacing: .02em; text-align: center; }
@media (max-width: 520px) {
  body { padding-inline: 0; padding-block: 0; gap: 0; }
  #root { width: 100%; height: 100%; }
  .caption-out { display: none; }
  .device { border-radius: 0 !important; box-shadow: none !important; }
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num, .tnum { font-variant-numeric: tabular-nums; }

.device { position: relative; height: 100%; background: var(--bg); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(10, 20, 40, .22), 0 0 0 1px var(--line); }
/* Behind the iPhone status bar when installed to the Home Screen; zero height elsewhere. */
.statusbar { flex: none; height: env(safe-area-inset-top, 0px); background: var(--hero-a); }
/* iOS zooms into inputs smaller than 16px; keep them at 16px or larger. */
.input, select.input, textarea.input { font-size: 16px; }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.pad { padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.screen-in { animation: rise .45s ease both; }
@keyframes rise { from { opacity: .75; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Tab bar */
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--ink-3); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; border-radius: 12px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--teal-ink); }
.tab[aria-current="page"] .tab-dot { opacity: 1; }
.tab-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0; }

/* Type */
.display { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.12; letter-spacing: -.01em; text-wrap: balance; }
.title { font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.h3 { font-weight: 650; font-size: 16px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; color: var(--ink-3); }

/* Hero */
.hero { position: relative; color: var(--on-hero); background: linear-gradient(170deg, var(--hero-a) 0%, var(--hero-b) 55%, var(--hero-c) 100%); padding: 26px 22px 92px; overflow: hidden; }
.hero .eyebrow { color: color-mix(in srgb, var(--on-hero) 70%, transparent); }
.hero-glow { position: absolute; inset: -40% -20% auto auto; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 236, 200, .35), transparent 65%); animation: breathe 9s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.12); opacity: 1; } }
.hero svg.hills { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 110px; }
.hero-inner { position: relative; display: flex; flex-direction: column; gap: 6px; }
.hero-label { margin-top: 18px; font-size: 13.5px; opacity: .85; }
.hero-num { font-family: var(--display); font-size: 54px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hero-sub { font-size: 13.5px; opacity: .8; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.glass { background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .2); color: var(--on-hero); border-radius: 999px; padding: 6px 12px; font-size: 13px; backdrop-filter: blur(6px); }
.glass b { font-weight: 650; font-variant-numeric: tabular-nums; margin-left: 4px; }
.lift { margin-top: -64px; position: relative; }

/* Cards */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card.soft { background: var(--teal-soft); box-shadow: none; }
.card.warnc { background: var(--warn-soft); box-shadow: none; }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.stack-lg { display: flex; flex-direction: column; gap: 14px; }

.avatar { width: 40px; height: 40px; flex: none; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.teal { background: var(--teal-soft); color: var(--teal-ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.stop { background: var(--stop-soft); color: var(--stop); }
.chip.demo { background: var(--warn-soft); color: var(--warn); letter-spacing: .04em; text-transform: uppercase; font-size: 10.5px; }

.bar { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar span { height: 100%; transition: width .6s ease; }
.bar .c { background: var(--teal); }
.bar .p { background: repeating-linear-gradient(-45deg, var(--pending), var(--pending) 4px, color-mix(in srgb, var(--pending) 55%, transparent) 4px, color-mix(in srgb, var(--pending) 55%, transparent) 8px); }
.bar .o { background: var(--warn); }
.bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.big-num { font-family: var(--display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 650; }
.stat span { font-size: 12px; color: var(--ink-2); }

/* Buttons */
.btn { border: 0; border-radius: 999px; padding: 13px 18px; font-weight: 650; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s ease, opacity .15s; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.secondary { background: var(--surface-2); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--teal-ink); padding: 10px 12px; }
.btn.danger { background: transparent; color: var(--stop); }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 13px; font-size: 13.5px; }
.link { background: none; border: 0; padding: 0; color: var(--teal-ink); font-weight: 600; font-size: 13.5px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { text-align: left; background: var(--surface); border: 0; border-radius: var(--r-md); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-height: 108px; }
.tile .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal-ink); }
.tile .ic svg { width: 19px; height: 19px; }
.tile b { font-size: 15px; font-weight: 650; }
.tile small { color: var(--ink-3); font-size: 12.5px; }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.li .sub { font-size: 12.5px; color: var(--ink-3); }
.strike { text-decoration: line-through; color: var(--ink-3); }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field small { color: var(--ink-3); font-size: 12.5px; }
.input, .money, select.input, textarea.input { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; }
.money { display: flex; align-items: center; gap: 4px; }
.money span { color: var(--ink-3); font-weight: 600; }
.money input { border: 0; background: none; outline: none; width: 100%; font-size: 20px; font-variant-numeric: tabular-nums; }
.money:focus-within, .input:focus { border-color: var(--teal); outline: none; }
textarea.input { min-height: 96px; resize: vertical; }
.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 9px 6px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 550; }
.pill[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--teal-ink); }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.choice[aria-pressed="true"] { border-color: var(--teal); background: color-mix(in srgb, var(--teal-soft) 60%, var(--surface)); }
.choice b { font-size: 15px; }
.choice span { font-size: 13px; color: var(--ink-2); }
.toggle { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; width: 100%; }
.switch { width: 46px; height: 28px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.toggle[aria-checked="true"] .switch { background: var(--teal); border-color: var(--teal); }
.toggle[aria-checked="true"] .switch::after { transform: translateX(18px); }
.note { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }

/* Sheets */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: rgba(8, 16, 30, .42); animation: fade .25s ease both; }
.sheet { position: relative; background: var(--bg); border-radius: 28px 28px 0 0; max-height: 93%; display: flex; flex-direction: column; animation: slide .32s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateY(40px); opacity: .3; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 18px 18px 8px 22px; position: relative; }
.sheet-head h2 { font-family: var(--display); font-weight: 500; font-size: 22px; flex: 1; text-wrap: balance; }
.grabber { position: absolute; top: 7px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 4px; background: var(--line); }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink-2); font-size: 18px; line-height: 1; flex: none; }
.sheet-body { overflow-y: auto; padding: 8px 22px 22px; display: flex; flex-direction: column; gap: 16px; }
.sheet-foot { padding: 12px 22px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; background: var(--bg); }

.toast { position: absolute; left: 16px; right: 16px; bottom: 86px; z-index: 40; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 16px; font-size: 14px; box-shadow: var(--shadow); animation: slide .3s ease both; }

/* Demo card */
.vcard { position: relative; aspect-ratio: 1.586; max-width: 100%; border-radius: 20px; padding: 18px; color: #F6F4EF; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; background: linear-gradient(135deg, #1B2F55, #2C5872 60%, #4A8984); box-shadow: 0 14px 30px rgba(20, 40, 70, .25); }
.vcard.single { background: linear-gradient(135deg, #3A3358, #5B5A86 60%, #8A8FB0); }
.vcard.dim { filter: grayscale(.7); opacity: .7; }
.vcard .ribbon { position: absolute; top: 14px; right: -44px; transform: rotate(35deg); background: #F2D9A8; color: #3A2A10; font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 4px 48px; }
.vcard .pan { font-variant-numeric: tabular-nums; font-size: 17px; letter-spacing: .12em; }
.vcard .wave { position: absolute; right: -30px; bottom: -40px; width: 200px; height: 200px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 0 0 22px rgba(255,255,255,.04), 0 0 0 44px rgba(255,255,255,.03); }
.vcard small { font-size: 11px; opacity: .75; letter-spacing: .06em; text-transform: uppercase; }

/* Shield mock */
.shield { border-radius: 30px; padding: 30px 22px 22px; background: linear-gradient(180deg, #24406A, #1A2D4E); color: #F2F4F7; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.shield .sicon { width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,.12); display: grid; place-items: center; }
.shield h3 { font-size: 20px; font-weight: 650; }
.shield p { font-size: 14px; opacity: .85; }
.shield .sbtn { width: 100%; border: 0; border-radius: 14px; padding: 13px; font-weight: 650; }
.shield .sbtn.p { background: #8CC3BC; color: #10233A; margin-top: 8px; }
.shield .sbtn.s { background: transparent; color: #CFE2DF; }

/* Onboarding */
.onb { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.onb-top { padding: 18px 22px 0; display: flex; align-items: center; gap: 10px; }
.dots { display: flex; gap: 6px; flex: 1; }
.dots i { height: 4px; flex: 1; border-radius: 4px; background: var(--line); }
.dots i.on { background: var(--teal); }
.onb-body { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 18px; animation: rise .4s ease both; }
.onb-foot { padding: 14px 22px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; }
.onb-hero { border-radius: var(--r-lg); overflow: hidden; position: relative; height: 200px; background: linear-gradient(170deg, var(--hero-a), var(--hero-b) 60%, var(--hero-c)); }
.onb-hero svg { position: absolute; bottom: -1px; left: 0; width: 100%; height: 120px; }

.test-row { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; padding: 8px 0; border-top: 1px solid var(--line); }
.test-row:first-child { border-top: 0; }
.dotok { width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; margin-top: 1px; }

.mile { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.mile:first-child { border-top: 0; }
.mile .m { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--ink-3); }
.mile.done .m { background: var(--teal-soft); border-color: var(--teal); color: var(--teal-ink); }

details.fold summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--teal-ink); list-style: none; }
details.fold summary::-webkit-details-marker { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<p class="caption-out">Arca · interactive prototype · fictional data, no real cards or money</p>
<div id="root"><p style="padding:24px;color:var(--ink-2)">Loading the Arca prototype…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="engine.js"></script>
<script type="text/babel" data-presets="react">
const E = window.ArcaEngine;
const { useState, useEffect, useRef, useCallback } = React;
const STORE_KEY = 'pause-demo-state';
const TAB_KEY = 'pause-demo-tab';

/* ---------- persistence (per-browser; safe to fail) ---------- */
function loadState() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.version === E.STATE_VERSION) return s; } } catch (e) {}
  return null;
}
function saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }

/* ---------- formatting ---------- */
const $ = (c, short) => E.formatCents(c, { short });
const centsToInput = c => (c === null || c === undefined) ? '' : Math.floor(c / 100) + '.' + String(c % 100).padStart(2, '0');
const fmtDay = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtLong = t => new Date(t).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const fmtWhen = t => new Date(t).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const fmtTime = t => new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
function relDay(t, now) {
  const d = Math.round((E.startOfDay(t) - E.startOfDay(now)) / E.DAY);
  if (d === 0) return 'today'; if (d === -1) return 'yesterday'; if (d === 1) return 'tomorrow';
  if (d < 0 && d > -7) return (-d) + ' days ago';
  return fmtDay(t);
}

const MODE = {
  reminder: { label: 'Gentle reminder', short: 'Reminder', desc: 'Arca reminds you of your budget when you log or try a purchase. Nothing is blocked.' },
  access: { label: 'Shopping access restriction', short: 'Shop shield', desc: 'Screen Time covers the shopping app or site with a pause screen. You can wait, or open it for 10 minutes. Payments still go through.' },
  payment: { label: 'Payment restriction', short: 'Card limit', desc: 'Your envelope card declines purchases at other merchants or above what’s left. Needs a card program partner (Phase 2), so it’s simulated here.' }
};
const FIELD_LABEL = { budget: 'Budget', mode: 'Restriction', commitment: 'Commitment mode', cooling: 'Cooling-off', active: 'Envelope' };
function describeChange(c, s) {
  if (c.field === 'budget') return `Budget rises to ${$(c.value)}`;
  if (c.field === 'mode') return `Restriction changes to ${MODE[c.value].label.toLowerCase()}`;
  if (c.field === 'commitment') return c.value ? 'Commitment mode turns on' : 'Commitment mode turns off';
  if (c.field === 'cooling') return `Cooling-off shortens to ${c.value} hours`;
  if (c.field === 'active') return 'Envelope closes';
  return 'Change';
}
const DECLINE_COPY = {
  over_allowance: (r, m) => `This would go past what’s left in your ${m} envelope. You have ${$(r.availableCents)} available, so the payment was declined.`,
  wrong_merchant: (r, m, other) => `This card only works at ${m}. ${other} isn’t part of this envelope, so the payment was declined.`,
  card_used: (r, m) => `This single-use card already paid for something at ${m}. Single-use cards close after one approved purchase.`,
  card_inactive: () => 'This card isn’t active.',
  envelope_closed: (r, m) => `The ${m} envelope is closed, so its card no longer approves purchases.`
};
const REFLECT_PROMPTS = ['What was going on when you wanted it?', 'How will you feel about this tomorrow?', 'What would you rather this money do?', 'What helped you decide?'];

/* ---------- small pieces ---------- */
const Icon = ({ name }) => {
  const p = {
    home: <path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z" />,
    env: <><rect x="3.5" y="6" width="17" height="12.5" rx="2.5" /><path d="m4 7.5 8 5.5 8-5.5" /></>,
    progress: <><path d="M4 19.5h16" /><path d="M7 16v-4M12 16V8M17 16v-6" /></>,
    gear: <><circle cx="12" cy="12" r="3" /><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6" /></>,
    card: <><rect x="3" y="6" width="18" height="12.5" rx="2.5" /><path d="M3 10h18M7 15h4" /></>,
    pen: <path d="M5 19h3.5L19 8.5 15.5 5 5 15.5zM13.5 7l3.5 3.5" />,
    heart: <path d="M12 19s-7-4.4-7-9.5A3.8 3.8 0 0 1 12 7a3.8 3.8 0 0 1 7 2.5C19 14.6 12 19 12 19z" />,
    leaf: <path d="M5 19c0-8 5-13 14-13 0 9-5 13-11 13M5 19l7-7" />,
    shield: <path d="M12 3.5 5 6.5v5c0 4.3 3 7.6 7 9 4-1.4 7-4.7 7-9v-5z" />,
    check: <path d="m6 12.5 4 4 8-9" />,
    clock: <><circle cx="12" cy="12" r="8" /><path d="M12 7.5V12l3 2" /></>,
    plus: <path d="M12 5v14M5 12h14" />
  }[name];
  return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{p}</svg>;
};

function Hills() {
  return (
    <svg className="hills" viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 60 C60 30 120 40 180 55 S300 35 400 50 V110 H0Z" fill="var(--hill-1)" opacity=".55" />
      <path d="M0 78 C70 55 140 70 210 76 S330 58 400 70 V110 H0Z" fill="var(--hill-2)" opacity=".8" />
      <path d="M0 96 C90 80 170 92 250 94 S350 86 400 90 V110 H0Z" fill="var(--bg)" />
    </svg>
  );
}

function merchantColor(state, id) {
  const i = Math.max(0, state.merchants.findIndex(m => m.id === id));
  return `var(--m${(i % 4) + 1})`;
}
function Avatar({ state, merchantId }) {
  const m = E.findMerchant(state, merchantId);
  return <span className="avatar" style={{ background: merchantColor(state, merchantId) }} aria-hidden="true">{m ? m.name[0] : '?'}</span>;
}
function ModeChip({ mode }) { return <span className={'chip ' + (mode === 'payment' ? 'teal' : '')}>{MODE[mode].short}</span>; }

function Bar({ budget, completed, pending }) {
  const total = Math.max(budget, completed + pending, 1);
  const over = completed + pending > budget;
  return (
    <div className="bar" role="img" aria-label={`${$(completed)} spent and ${$(pending)} held of ${$(budget)}`}>
      <span className="c" style={{ width: (Math.min(completed, budget) / total * 100) + '%' }} />
      <span className="p" style={{ width: (Math.max(0, Math.min(pending, budget - completed)) / total * 100) + '%' }} />
      {over && <span className="o" style={{ width: ((completed + pending - budget) / total * 100) + '%' }} />}
      {over && <span className="mark" style={{ left: (budget / total * 100) + '%' }} />}
    </div>
  );
}

function MoneyInput({ id, label, value, onChange, hint, autoFocus }) {
  return (
    <div className="field">
      <span><label htmlFor={id}>{label}</label></span>
      <div className="money"><span>$</span><input id={id} inputMode="decimal" autoComplete="off" placeholder="0.00" value={value} autoFocus={autoFocus} onChange={e => onChange(e.target.value.replace(/[^0-9.,$]/g, ''))} /></div>
      {hint && <small>{hint}</small>}
    </div>
  );
}
function TextField({ id, label, value, onChange, placeholder, hint, maxLength }) {
  return (
    <div className="field">
      <span><label htmlFor={id}>{label}</label></span>
      <input id={id} className="input" value={value} placeholder={placeholder} maxLength={maxLength || 60} onChange={e => onChange(e.target.value)} />
      {hint && <small>{hint}</small>}
    </div>
  );
}
function Seg({ options, value, onChange, label }) {
  return <div className="seg" role="group" aria-label={label}>{options.map(o => <button key={o.value} type="button" aria-pressed={value === o.value} onClick={() => onChange(o.value)}>{o.label}</button>)}</div>;
}
function Toggle({ checked, onChange, label, sub }) {
  return (
    <button type="button" className="toggle" role="switch" aria-checked={checked} onClick={() => onChange(!checked)}>
      <span className="grow"><b style={{ display: 'block', fontSize: 15 }}>{label}</b>{sub && <span className="small muted">{sub}</span>}</span>
      <span className="switch" />
    </button>
  );
}

function Sheet({ title, onClose, children, footer }) {
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, [onClose]);
  return (
    <div className="sheet-wrap" role="dialog" aria-modal="true" aria-label={title}>
      <div className="scrim" onClick={onClose} />
      <div className="sheet">
        <div className="sheet-head"><span className="grabber" /><h2>{title}</h2><button className="icon-btn" onClick={onClose} aria-label="Close">×</button></div>
        <div className="sheet-body">{children}</div>
        {footer && <div className="sheet-foot">{footer}</div>}
      </div>
    </div>
  );
}

/* ---------- encouragement ---------- */
function pickEncouragement(state, now, prog, goal) {
  const c = [];
  const goalLine = goal ? (goal.pace && goal.pace.onTrack ? `Your ${goal.name} goal is still on track.` : `Your ${goal.name} goal is still yours to build.`) : '';
  const lastDecl = prog.declined.intents[prog.declined.intents.length - 1];
  if (lastDecl && now - lastDecl.lastAt < 7 * E.DAY) c.push({ id: 'decl_' + lastDecl.intentId, at: lastDecl.lastAt, text: `You gave yourself time to decide. ${goalLine}` });
  const waits = state.shieldEvents.filter(e => e.outcome === 'waited' && e.at <= now);
  const lastWait = waits[waits.length - 1];
  if (lastWait && now - lastWait.at < 3 * E.DAY) {
    const env = E.findEnv(state, lastWait.envelopeId); const m = env && E.findMerchant(state, env.merchantId);
    c.push({ id: 'sh_' + lastWait.id, at: lastWait.at, text: `You closed ${m ? m.name : 'the app'} instead of browsing. That was the plan you made.` });
  }
  state.wishlist.filter(w => w.status === 'waiting' && w.revisitAt <= now).forEach(w => c.push({ id: 'wish_' + w.id, at: w.revisitAt, text: `The waiting period for “${w.label}” is over. Decide when you’re ready. Leaving it on the list is a fine answer too.`, action: 'wishlist' }));
  if (prog.days.streak >= 3) c.push({ id: 'streak_' + prog.days.streak, at: now - 1, text: `${prog.days.streak} days in a row with every envelope inside its budget.` });
  return c.filter(x => !(state.dismissed || {})[x.id]).sort((a, b) => b.at - a.at)[0] || null;
}

/* ================= HOME ================= */
function Home({ ctx }) {
  const { state, now, open, act } = ctx;
  const sums = E.activeEnvelopes(state, now).map(e => E.envelopeSummary(state, e.id, now));
  const avail = sums.reduce((a, x) => a + x.availableCents, 0);
  const budget = sums.reduce((a, x) => a + x.budgetCents, 0);
  const goal = E.goalSummary(state, now);
  const prog = E.progress(state, now);
  const enc = pickEncouragement(state, now, prog, goal);
  const pend = sums.flatMap(x => x.pendingChanges.map(c => ({ ...c, sum: x })));
  const wishWaiting = state.wishlist.filter(w => w.status === 'waiting');
  const wishReady = wishWaiting.filter(w => w.revisitAt <= now).length;
  const h = new Date(now).getHours();
  const greet = h < 5 ? 'Good evening' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const name = state.profile.name;
  const dismiss = id => act(s => ({ state: { ...s, dismissed: { ...(s.dismissed || {}), [id]: now } } }));

  return (
    <div className="screen-in">
      <section className="hero">
        <div className="hero-glow" />
        <Hills />
        <div className="hero-inner">
          <p className="eyebrow">{fmtLong(now)}</p>
          <h1 className="display">{greet}{name ? `, ${name}` : ''}.</h1>
          <p className="hero-label">Left to spend, by your own plan</p>
          <p className="hero-num">{$(avail)}</p>
          <p className="hero-sub">of {$(budget, true)} across {sums.length} envelope{sums.length === 1 ? '' : 's'} · each resets on its own schedule</p>
          <div className="hero-chips">
            {sums.map(x => <button key={x.id} className="glass" onClick={() => open('envelope', { id: x.id })}>{x.merchant.name}<b>{$(x.availableCents)}</b></button>)}
          </div>
        </div>
      </section>

      <div className="pad lift">
        {enc && (
          <div className="card soft" role="status">
            <div className="row" style={{ alignItems: 'flex-start' }}>
              <span style={{ color: 'var(--teal-ink)', width: 22, flex: 'none', marginTop: 2 }}><Icon name="leaf" /></span>
              <p className="grow" style={{ fontFamily: 'var(--display)', fontSize: 18, lineHeight: 1.35 }}>{enc.text}</p>
              <button className="icon-btn" style={{ background: 'transparent' }} aria-label="Dismiss" onClick={() => dismiss(enc.id)}>×</button>
            </div>
            <div className="row">
              {enc.action === 'wishlist' && <button className="btn sm secondary" onClick={() => open('wishlist')}>Open wishlist</button>}
              <button className="link" onClick={() => open('reflect')}>Add a reflection</button>
            </div>
          </div>
        )}

        {goal ? (
          <div className="card">
            <div className="row between">
              <div><p className="eyebrow">Saving toward</p><h2 className="title" style={{ fontSize: 22 }}>{goal.name}</h2></div>
              {goal.pace && <span className={'chip ' + (goal.pace.onTrack ? 'teal' : 'warn')}>{goal.pace.onTrack ? 'On pace' : 'Behind pace'}</span>}
            </div>
            <div className="row between" style={{ alignItems: 'baseline' }}>
              <span className="big-num">{$(goal.reportedCents, true)}</span>
              <span className="muted small">of {$(goal.targetCents, true)} target{goal.byDate ? ` by ${new Date(goal.byDate).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })}` : ''}</span>
            </div>
            <Bar budget={goal.targetCents} completed={Math.min(goal.reportedCents, goal.targetCents)} pending={0} />
            <div className="stack small">
              <div className="row between"><span className="muted">Moved to savings (you reported)</span><b className="tnum">{$(goal.reportedCents)}</b></div>
              <div className="row between"><span className="muted">Verified deposits</span><span className="chip">Not connected</span></div>
            </div>
            <p className="tiny">Your target is the plan. Only money you actually move counts toward it. Skipped or declined purchases are tracked separately.</p>
            <div className="row">
              <button className="btn sm secondary" onClick={() => open('savings')}>Record a transfer</button>
              <button className="link" onClick={() => open('goal')}>Edit goal</button>
            </div>
          </div>
        ) : (
          <div className="card"><p className="h3">Add something to save toward</p><button className="btn secondary" onClick={() => open('goal')}>Set a goal</button></div>
        )}

        <div className="tiles">
          <button className="tile" onClick={() => open('purchase', {})}><span className="ic"><Icon name="card" /></span><b>Try a purchase</b><small>See how an envelope card would respond</small></button>
          <button className="tile" onClick={() => open('spend', {})}><span className="ic"><Icon name="pen" /></span><b>Log spending</b><small>Add something you bought</small></button>
          <button className="tile" onClick={() => open('wishlist')}><span className="ic"><Icon name="heart" /></span><b>Wishlist</b><small>{wishWaiting.length} waiting{wishReady ? ` · ${wishReady} ready to revisit` : ''}</small></button>
          <button className="tile" onClick={() => open('reflect')}><span className="ic"><Icon name="leaf" /></span><b>Reflect</b><small>A minute with how you feel</small></button>
        </div>

        {pend.length > 0 && (
          <div className="card flat">
            <div className="row"><span style={{ width: 20, color: 'var(--warn)' }}><Icon name="clock" /></span><p className="h3">Changes waiting out their cooling-off</p></div>
            <div className="list">
              {pend.map((c, i) => (
                <div className="li" key={i}>
                  <div className="grow"><div>{c.sum.merchant.name}: {describeChange(c)}</div><div className="sub">Takes effect {fmtWhen(c.effectiveAt)}</div></div>
                  <button className="btn sm secondary" onClick={() => act(s => E.cancelPending(s, c.sum.id, c.field, c.effectiveAt, now), 'Change cancelled. Your earlier setting stays.')}>Cancel</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ================= ENVELOPES ================= */
function Envelopes({ ctx }) {
  const { state, now, open } = ctx;
  const sums = E.activeEnvelopes(state, now).map(e => E.envelopeSummary(state, e.id, now));
  return (
    <div className="pad screen-in">
      <div className="stack" style={{ paddingTop: 8 }}>
        <p className="eyebrow">Envelopes</p>
        <h1 className="display">Decisions you made ahead of time</h1>
        <p className="muted">Each envelope holds a budget for one shop or app, plus how firmly Arca should help you keep it.</p>
      </div>
      {sums.map(x => <EnvelopeCard key={x.id} x={x} ctx={ctx} />)}
      {sums.length === 0 && <div className="card flat"><p className="muted">No envelopes yet. Make one for a shop you’d like to spend less at.</p></div>}
      <button className="btn primary block" onClick={() => open('editor', {})}><Icon name="plus" /> New envelope</button>
    </div>
  );
}

function EnvelopeCard({ x, ctx }) {
  const { state, open } = ctx;
  const closing = x.pendingChanges.find(c => c.field === 'active');
  return (
    <button className="card" style={{ border: 0, textAlign: 'left', cursor: 'pointer' }} onClick={() => open('envelope', { id: x.id })}>
      <div className="row">
        <Avatar state={state} merchantId={x.env.merchantId} />
        <div className="grow"><div className="h3">{x.merchant.name}</div><div className="tiny">{x.cadence === 'weekly' ? 'Weekly' : 'Monthly'} · resets {fmtDay(x.resetsAt)}</div></div>
        <ModeChip mode={x.rules.mode} />
      </div>
      <div className="row between" style={{ alignItems: 'baseline' }}>
        <span className="big-num">{$(x.availableCents)}</span>
        <span className="small muted">available of {$(x.budgetCents, true)}</span>
      </div>
      <Bar budget={x.budgetCents} completed={x.completedCents} pending={x.pendingCents} />
      <div className="row wrap small muted" style={{ gap: 14 }}>
        <span>Spent <b className="tnum" style={{ color: 'var(--ink)' }}>{$(x.completedCents)}</b></span>
        <span>Held <b className="tnum" style={{ color: 'var(--ink)' }}>{$(x.pendingCents)}</b></span>
        {x.rules.commitment && <span className="chip teal">Commitment · {x.rules.coolingHours}h</span>}
        {x.overCents > 0 && <span className="chip warn">{$(x.overCents)} over</span>}
        {closing && <span className="chip stop">Closes {fmtDay(closing.effectiveAt)}</span>}
      </div>
    </button>
  );
}

function EnvelopeSheet({ ctx, id }) {
  const { state, now, open, act, close } = ctx;
  const [confirmClose, setConfirmClose] = useState(false);
  const x = E.envelopeSummary(state, id, now);
  if (!x || !x.rules.active) return <Sheet title="Envelope closed" onClose={close}><p className="muted">This envelope is closed.</p></Sheet>;
  const m = x.merchant.name;
  const holds = state.holds.filter(h => h.envelopeId === id && h.status === 'pending');
  const spends = state.spend.filter(s => s.envelopeId === id && s.occurredAt >= x.periodStart && s.occurredAt < x.resetsAt).sort((a, b) => b.occurredAt - a.occurredAt);
  const declines = state.attempts.filter(a => a.envelopeId === id && a.decision === 'declined' && a.at >= x.periodStart && a.at <= now).sort((a, b) => b.at - a.at);
  const doClose = () => {
    const r = act(s => E.requestChange(s, id, 'active', false, now));
    if (!r) return;
    if (r.delayed) { ctx.notify(`The ${m} envelope will close ${fmtWhen(r.effectiveAt)}, after its cooling-off.`); setConfirmClose(false); }
    else { ctx.notify(`The ${m} envelope is closed.`); close(); }
  };
  return (
    <Sheet title={m} onClose={close}>
      <div className="row"><Avatar state={state} merchantId={x.env.merchantId} /><div className="grow"><div className="small muted">{x.cadence === 'weekly' ? 'Weekly' : 'Monthly'} envelope</div><div className="small">Resets {fmtWhen(x.resetsAt)}</div></div><ModeChip mode={x.rules.mode} /></div>
      <div className="card">
        <div className="row between" style={{ alignItems: 'baseline' }}><span className="big-num">{$(x.availableCents)}</span><span className="small muted">available now</span></div>
        <Bar budget={x.budgetCents} completed={x.completedCents} pending={x.pendingCents} />
        <div className="legend"><span><i style={{ background: 'var(--teal)' }} />Completed</span><span><i style={{ background: 'var(--pending)' }} />Pending hold</span>{x.overCents > 0 && <span><i style={{ background: 'var(--warn)' }} />Over budget</span>}</div>
        <div className="stats">
          <div className="stat"><b>{$(x.budgetCents)}</b><span>Budget this period</span></div>
          <div className="stat"><b>{$(x.completedCents)}</b><span>Completed spending</span></div>
          <div className="stat"><b>{$(x.pendingCents)}</b><span>Pending holds</span></div>
          <div className="stat"><b>{$(x.availableCents)}</b><span>Available</span></div>
        </div>
        {x.overCents > 0 && <p className="note warn">This envelope is {$(x.overCents)} past its budget, often from a budget reduction, a manual entry, or an envelope without payment restriction. Nothing already spent is reversed.</p>}
      </div>

      <div className="stack">
        <p className="eyebrow">How Arca steps in</p>
        <p><b>{MODE[x.rules.mode].label}.</b> <span className="muted small">{MODE[x.rules.mode].desc}</span></p>
        <p className="small">{x.rules.commitment
          ? <>Commitment mode is on. Raising the budget, loosening the restriction, turning commitment off or closing this envelope waits <b>{x.rules.coolingHours} hours</b>. Lowering the budget or tightening the restriction applies right away.</>
          : <>Commitment mode is off, so changes apply right away. Turn it on to add a cooling-off period before any loosening.</>}</p>
      </div>

      {x.pendingChanges.length > 0 && (
        <div className="card warnc">
          <p className="h3">Waiting out the cooling-off</p>
          {x.pendingChanges.map((c, i) => (
            <div className="row between" key={i}>
              <div className="grow small"><div>{describeChange(c)}</div><div className="tiny">Takes effect {fmtWhen(c.effectiveAt)}</div></div>
              <button className="btn sm secondary" onClick={() => act(s => E.cancelPending(s, id, c.field, c.effectiveAt, now), 'Change cancelled.')}>Cancel</button>
            </div>
          ))}
        </div>
      )}

      <div className="tiles">
        <button className="tile" onClick={() => open('editor', { id })}><span className="ic"><Icon name="pen" /></span><b>Edit rules</b><small>Budget, restriction, commitment</small></button>
        <button className="tile" onClick={() => open('card', { envId: id })}><span className="ic"><Icon name="card" /></span><b>Demo card</b><small>Preview only, no live card</small></button>
        <button className="tile" onClick={() => open('purchase', { envId: id })}><span className="ic"><Icon name="check" /></span><b>Try a purchase</b><small>Simulate an authorization</small></button>

              <div className="li" key={h.id} style={{ flexWrap: 'wrap' }}>
                <div className="grow"><div>{h.note || 'Card purchase'}</div><div className="sub">Authorized {relDay(h.createdAt, now)}, {fmtTime(h.createdAt)}</div></div>

                <div className="row" style={{ width: '100%', justifyContent: 'flex-end' }}>

        <p className="eyebrow">This period</p>

          {spends.length === 0 && declines.length === 0 && <p className="muted small" style={{ padding: '10px 0' }}>Nothing yet this period.</p>}
          <div className="list">
            {spends.map(sp => {
              const ref = E.refundedCents(state, sp.id, now);
              return (
                <div className="li" key={sp.id}>
                  <div className="grow"><div>{sp.note || (sp.source === 'card' ? 'Card purchase' : 'Logged purchase')}</div>

                  <div style={{ textAlign: 'right' }}>
                    <div className={'amt ' + (ref === sp.amountCents ? 'strike' : '')}>{$(sp.amountCents)}</div>
                    {ref < sp.amountCents && <button className="link" style={{ fontSize: 12.5 }} onClick={() => open('refund', { spendId: sp.id })}>Refund</button>}
                  </div>
                </div>
              );
            })}
            {declines.map(a => (
              <div className="li" key={a.id}>
                <div className="grow"><div>{a.note || 'Purchase attempt'} <span className="chip stop" style={{ marginLeft: 4 }}>Declined</span></div><div className="sub">{relDay(a.at, now)} · {a.reason === 'wrong_merchant' ? 'other merchant' : 'over allowance'}{a.isRetry ? ' · retry, counted once' : ''}</div></div>
                <span className="amt muted">{$(a.amountCents)}</span>

        <button className="btn danger" onClick={() => setConfirmClose(true)}>Close this envelope</button>

          <div className="row"><button className="btn sm primary" onClick={doClose}>{x.rules.commitment ? 'Schedule closing' : 'Close envelope'}</button><button className="btn sm secondary" onClick={() => setConfirmClose(false)}>Keep it</button></div>
        </div>
      )}
    </Sheet>
  );
}

function EditorSheet({ ctx, id }) {
  const { state, now, act, close, replace } = ctx;
  const editing = !!id;
  const sum = editing ? E.envelopeSummary(state, id, now) : null;
  const used = new Set(E.activeEnvelopes(state, now).map(e => e.merchantId));
  const freeMerchants = state.merchants.filter(m => !used.has(m.id));
  const [merchantId, setMerchantId] = useState(editing ? sum.env.merchantId : (freeMerchants[0] ? freeMerchants[0].id : '__new'));
  const [customName, setCustomName] = useState('');
  const [customDomain, setCustomDomain] = useState('');
  const [cadence, setCadence] = useState(editing ? sum.cadence : 'monthly');
  const [budget, setBudget] = useState(editing ? centsToInput(sum.budgetCents) : '75.00');
  const [mode, setMode] = useState(editing ? sum.rules.mode : 'payment');
  const [commitment, setCommitment] = useState(editing ? sum.rules.commitment : true);
  const [cooling, setCooling] = useState(editing ? sum.rules.coolingHours : 48);
  const budgetCents = E.toCents(budget);

  // Preview: run the same requests on a copy and report timing.
  let preview = [], previewErr = null;
  if (editing && budgetCents) {
    try {
      let s = state;
      [['commitment', commitment], ['cooling', cooling], ['mode', mode], ['budget', budgetCents]].forEach(([f, v]) => {
        const out = E.requestChange(s, id, f, v, now); s = out.state;
        if (!out.result.unchanged || out.result.cancelledPending) preview.push({ f, v, ...out.result });
      });
    } catch (e) { previewErr = e.message; }
  }
  const save = () => {
    if (!budgetCents) { ctx.notify('Enter a budget above $0.'); return; }
    if (editing) {
      let ok = true;
      [['commitment', commitment], ['cooling', cooling], ['mode', mode], ['budget', budgetCents]].forEach(([f, v]) => { if (ok && !act(s => E.requestChange(s, id, f, v, now))) ok = false; });
      if (!ok) return;
      const delayed = preview.filter(p => p.delayed);
      ctx.notify(delayed.length ? `Saved. ${delayed.length} change${delayed.length > 1 ? 's' : ''} will wait out the cooling-off.` : 'Saved. Changes apply now.');
      close();
    } else {
      let mid = merchantId;
      if (mid === '__new') { const r = act(s => E.addMerchant(s, { name: customName, domain: customDomain })); if (!r) return; mid = r.merchantId; }
      const r = act(s => E.createEnvelope(s, { merchantId: mid, cadence, budgetCents, mode, commitment, coolingHours: cooling }, now));
      if (r) { ctx.notify('Envelope created with a reusable demo card.'); replace('envelope', { id: r.envelopeId }); }
    }
  };
  const sentence = p => {
    const what = p.f === 'budget' ? `Budget to ${$(p.v)}` : p.f === 'mode' ? `Restriction to ${MODE[p.v].label.toLowerCase()}` : p.f === 'commitment' ? `Commitment mode ${p.v ? 'on' : 'off'}` : `Cooling-off to ${p.v} hours`;
    return p.delayed ? `${what}: waits until ${fmtWhen(p.effectiveAt)}` : `${what}: applies now${p.cancelledPending ? ' (replaces a pending change)' : ''}`;
  };
  return (
    <Sheet title={editing ? `Edit ${sum.merchant.name}` : 'New envelope'} onClose={close}
      footer={<button className="btn primary block" disabled={!budgetCents || (!editing && merchantId === '__new' && !customName.trim())} onClick={save}>{editing ? 'Save changes' : 'Create envelope'}</button>}>
      {!editing && (
        <div className="field">
          <span>Merchant</span>
          <div className="pills">
            {freeMerchants.map(mm => <button key={mm.id} type="button" className="pill" aria-pressed={merchantId === mm.id} onClick={() => setMerchantId(mm.id)}>{mm.name}</button>)}
            <button type="button" className="pill" aria-pressed={merchantId === '__new'} onClick={() => setMerchantId('__new')}>+ Custom</button>
          </div>
        </div>
      )}
      {!editing && merchantId === '__new' && (
        <>
          <TextField id="cm-name" label="Merchant name" value={customName} onChange={setCustomName} placeholder="e.g. Fernway Outfitters" />
          <TextField id="cm-domain" label="Website (optional)" value={customDomain} onChange={setCustomDomain} placeholder="fernway.com" hint="Used for the shopping shield. A card network may describe this merchant differently, so a live card lock would be checked against the processor’s merchant data." />
        </>
      )}
      {!editing ? (
        <div className="field"><span>Resets</span><Seg label="Cadence" value={cadence} onChange={setCadence} options={[{ value: 'weekly', label: 'Weekly (Mondays)' }, { value: 'monthly', label: 'Monthly (1st)' }]} /></div>
      ) : (
        <p className="small muted">Resets {sum.cadence === 'weekly' ? 'every Monday' : 'on the 1st of each month'}. To change the cadence, close this envelope and make a new one, so past periods stay accurate.</p>
      )}
      <MoneyInput id="ed-budget" label={`Budget per ${editing ? (sum.cadence === 'weekly' ? 'week' : 'month') : (cadence === 'weekly' ? 'week' : 'month')}`} value={budget} onChange={setBudget}
        hint={editing ? 'Lowering it applies now. It doesn’t reverse anything already spent; available simply shows $0 until the next reset.' : null} />
      <div className="field">
        <span>How Arca steps in</span>
        <div className="stack">
          {['reminder', 'access', 'payment'].map(k => (
            <button key={k} type="button" className="choice" aria-pressed={mode === k} onClick={() => setMode(k)}><b>{MODE[k].label}</b><span>{MODE[k].desc}</span></button>
          ))}
        </div>
      </div>
      <div className="card flat">
        <Toggle checked={commitment} onChange={setCommitment} label="Commitment mode" sub="Adds a cooling-off period before any change that loosens this envelope." />
        {commitment && <Seg label="Cooling-off" value={cooling} onChange={setCooling} options={[24, 48, 72].map(h => ({ value: h, label: `${h} hours` }))} />}
        <p className="tiny">Delayed: raising the budget, a weaker restriction, a shorter cooling-off, turning commitment off, closing the envelope. Immediate: everything that makes it stricter.</p>
      </div>
      {editing && (preview.length > 0 || previewErr) && (
        <div className="card soft">
          <p className="h3">When these changes apply</p>
          {previewErr ? <p className="small">{previewErr}</p> : preview.map((p, i) => <p className="small" key={i}>{sentence(p)}</p>)}
        </div>
      )}
    </Sheet>
  );
}
