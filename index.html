/* ================= PURCHASE DEMO ================= */
function PurchaseSheet({ ctx, envId, cardId: initCard, merchantId: initMerchant, amountCents: initAmount, note: initNote }) {
  const { state, now, act, close, open, replace } = ctx;
  const active = E.activeEnvelopes(state, now).map(e => e.id);
  const cards = state.cards.filter(c => active.includes(c.envelopeId));
  const firstCard = initCard || (envId ? (cards.find(c => c.envelopeId === envId && c.status === 'active') || {}).id : null) || (cards.find(c => c.status === 'active') || cards[0] || {}).id;
  const [cardId, setCardId] = useState(firstCard || '');
  const card = E.findCard(state, cardId);
  const [merchantId, setMerchantId] = useState(initMerchant || (card ? card.merchantId : 'amazon'));
  const [amount, setAmount] = useState(initAmount ? centsToInput(initAmount) : '');
  const [note, setNote] = useState(initNote || '');
  const [result, setResult] = useState(null);
  if (!cards.length) return <Sheet title="Try a purchase" onClose={close}><p className="muted">Create an envelope first. Each one comes with a demo card.</p></Sheet>;
  const sum = card ? E.envelopeSummary(state, card.envelopeId, now) : null;
  const cents = E.toCents(amount);
  const pickCard = id => { setCardId(id); const c = E.findCard(state, id); if (c) setMerchantId(c.merchantId); };
  const submit = () => {
    const r = act(s => E.attemptPurchase(s, { cardId, merchantId, amountCents: cents, now, note }));
    if (r) setResult({ ...r, cardId, merchantId, amountCents: cents, note, envelopeId: card.envelopeId });
  };
  if (result) return <PurchaseResult ctx={ctx} r={result} onAgain={() => setResult(null)} />;
  return (
    <Sheet title="Try a purchase" onClose={close}
      footer={<><button className="btn primary block" disabled={!cents || !cardId} onClick={submit}>Pay {cents ? $(cents) : ''} with demo card</button><p className="tiny" style={{ textAlign: 'center' }}>Simulated authorization. No money moves.</p></>}>
      <div className="field"><span>Demo card</span>
        <select className="input" id="pd-card" value={cardId} onChange={e => pickCard(e.target.value)}>
          {cards.map(c => { const m = E.findMerchant(state, c.merchantId); return <option key={c.id} value={c.id}>{m.name} · {c.type === 'single_use' ? 'single-use' : 'reusable'} ••{c.last4}{c.status === 'used' ? ' (used)' : ''}</option>; })}
        </select>
        {sum && <small>{sum.merchant.name} envelope: {$(sum.availableCents)} available · {MODE[sum.rules.mode].label.toLowerCase()}</small>}
      </div>
      <div className="field"><span>Where you’re checking out</span>
        <div className="pills">{state.merchants.map(m => <button key={m.id} type="button" className="pill" aria-pressed={merchantId === m.id} onClick={() => setMerchantId(m.id)}>{m.name}</button>)}</div>
      </div>
      <MoneyInput id="pd-amount" label="Amount" value={amount} onChange={setAmount} />
      {sum && (
        <div className="pills">
          <button type="button" className="pill" onClick={() => setAmount(centsToInput(sum.availableCents))}>Exactly what’s left ({$(sum.availableCents)})</button>
          <button type="button" className="pill" onClick={() => setAmount(centsToInput(sum.availableCents + 1))}>1¢ over</button>
          <button type="button" className="pill" onClick={() => setAmount('24.99')}>$24.99</button>
        </div>
      )}
      <TextField id="pd-note" label="What is it? (optional)" value={note} onChange={setNote} placeholder="e.g. Wool sweater" />
    </Sheet>
  );
}

function PurchaseResult({ ctx, r, onAgain }) {
  const { state, now, act, close, open, replace } = ctx;
  const m = E.findMerchant(state, E.findCard(state, r.cardId).merchantId).name;
  const at = E.findMerchant(state, r.merchantId).name;
  const hold = r.holdId ? state.holds.find(h => h.id === r.holdId) : null;
  if (r.decision === 'approved') {
    return (
      <Sheet title="Approved" onClose={close}>
        <div className="card soft"><p style={{ fontFamily: 'var(--display)', fontSize: 20 }}>{$(r.amountCents)} at {at} fits your plan.</p>
          <p className="small">It’s now a pending hold on your {m} envelope. Holds count against your allowance until the merchant captures the payment or releases it.</p></div>
        {r.reason === 'approved_over_budget' && <p className="note warn">This takes the envelope {$(r.overByCents)} past its budget. Payment restriction is off for {m}, so the card approves it. Turn on payment restriction to have the card decline next time.</p>}
        {hold && hold.status === 'pending' ? (
          <div className="stack">
            <p className="eyebrow">What the merchant does next</p>
            <div className="row wrap">
              <button className="btn sm secondary" onClick={() => open('capture', { holdId: r.holdId })}>Merchant captures</button>
              <button className="btn sm secondary" onClick={() => act(s => E.releaseHold(s, r.holdId, now), x => `Released. ${$(x.releasedCents)} is available again.`)}>Merchant releases</button>
            </div>
          </div>
        ) : hold && <p className="small muted">This hold was {hold.status}.</p>}
        <div className="row"><button className="btn secondary" onClick={onAgain}>Try another</button><button className="btn primary grow" onClick={close}>Done</button></div>
      </Sheet>
    );
  }
  const copy = (DECLINE_COPY[r.reason] || (() => 'The payment was declined.'))(r, m, at);
  const canOverride = r.reason === 'over_allowance';
  return (
    <Sheet title="Paused at checkout" onClose={close}>
      <div className="card">
        <p style={{ fontFamily: 'var(--display)', fontSize: 21, lineHeight: 1.3 }}>Not this time. Nothing was charged.</p>
        <p className="muted">{copy}</p>
        {r.isRetry && <p className="tiny">This looks like another try at the same purchase, so Progress counts it once.</p>}
      </div>
      <p className="small muted">You set this limit earlier, when you weren’t standing at a checkout. Here are your options.</p>
      <div className="stack">
        <button className="btn primary block" onClick={() => replace('leave', { r })}>Leave it for now</button>
        <button className="btn secondary block" onClick={() => {
          const out = act(s => E.addWish(s, { label: r.note || `${at} purchase`, merchantId: r.merchantId, envelopeId: r.envelopeId, amountCents: r.amountCents, intentId: r.intentId }, now));
          if (out) { ctx.notify(out.duplicate ? 'It’s already on your wishlist.' : `Added to your wishlist. Revisit it ${fmtDay(out.revisitAt)}.`); close(); }
        }}>Add to wishlist</button>
        {canOverride
          ? <button className="btn ghost" onClick={() => replace('override', { r })}>Request an override</button>
          : <p className="tiny" style={{ textAlign: 'center' }}>{r.reason === 'wrong_merchant' ? `Overrides can’t change which merchant a card works at. Make an envelope for ${at} if you want a plan there.` : 'There’s nothing to override on this card.'}</p>}
      </div>
    </Sheet>
  );
}

function LeaveSheet({ ctx, r }) {
  const { now, act, close } = ctx;
  const [label, setLabel] = useState(r.note || '');
  const [prompt, setPrompt] = useState(REFLECT_PROMPTS[3]);
  const [text, setText] = useState('');
  const save = () => {
    if (!act(s => E.recordForgone(s, { envelopeId: r.envelopeId, merchantId: r.merchantId, label: label || 'Skipped purchase', amountCents: r.amountCents, intentId: r.intentId, source: 'decline' }, now))) return;
    if (text.trim()) act(s => E.addReflection(s, { text, prompt }, now));
    ctx.notify('You gave yourself time to decide. If you buy it later, mark it in Progress.');
    close();
  };
  return (
    <Sheet title="Leave it for now" onClose={close} footer={<button className="btn primary block" onClick={save}>Save and close</button>}>
      <p className="muted">This is noted as a purchase you chose to skip, worth {$(r.amountCents)}. You can mark it “bought later” at any time, and it won’t count as savings unless you move the money yourself.</p>
      <TextField id="lv-label" label="What was it?" value={label} onChange={setLabel} placeholder="e.g. Wool sweater" />
      <div className="field"><span>A short reflection (optional)</span>
        <div className="pills">{REFLECT_PROMPTS.map(p => <button key={p} type="button" className="pill" style={{ fontSize: 13 }} aria-pressed={prompt === p} onClick={() => setPrompt(p)}>{p}</button>)}</div>
        <textarea id="lv-text" className="input" value={text} onChange={e => setText(e.target.value)} placeholder="Only you see this." maxLength={400} />
      </div>
    </Sheet>
  );
}

function OverrideSheet({ ctx, r }) {
  const { state, now, act, close, replace } = ctx;
  const sum = E.envelopeSummary(state, r.envelopeId, now);
  const target = sum.budgetCents + Math.max(1, r.amountCents - sum.availableCents);
  const [done, setDone] = useState(null);
  const delayed = sum.rules.commitment;
  const effective = now + sum.rules.coolingHours * E.HOUR;
  const submit = () => { const out = act(s => E.requestChange(s, r.envelopeId, 'budget', target, now)); if (out) setDone(out); };
  if (done) {
    return (
      <Sheet title={done.delayed ? 'Override scheduled' : 'Budget raised'} onClose={close}>
        <div className="card soft">
          {done.delayed
            ? <p>Your {sum.merchant.name} budget will rise to <b>{$(target)}</b> on <b>{fmtWhen(done.effectiveAt)}</b>. You can cancel any time before then from the envelope.</p>
            : <p>Your {sum.merchant.name} budget is now <b>{$(target)}</b>.</p>}
        </div>
        <p className="note">The declined payment didn’t go through and won’t complete on its own. {done.delayed ? 'Once the change takes effect, you would need to check out again.' : 'To buy it, you’d need to check out again.'}</p>
        {!done.delayed && <button className="btn primary block" onClick={() => replace('purchase', { cardId: r.cardId, merchantId: r.merchantId, amountCents: r.amountCents, note: r.note })}>Check out again</button>}
        <button className="btn secondary block" onClick={close}>Done</button>
      </Sheet>
    );
  }
  return (
    <Sheet title="Request an override" onClose={close}>
      <p className="muted">An override raises this envelope’s budget enough for this purchase. It changes the plan rather than approving the declined payment.</p>
      <div className="stats">
        <div className="stat"><b>{$(sum.budgetCents)}</b><span>Budget now</span></div>
        <div className="stat"><b>{$(target)}</b><span>Budget after override</span></div>
      </div>
      {delayed
        ? <p className="note warn">Commitment mode is on. This increase waits {sum.rules.coolingHours} hours and takes effect around {fmtWhen(effective)}. You chose this delay when you set up the envelope.</p>
        : <p className="note">Commitment mode is off, so the higher budget applies right away.</p>}
      <p className="small muted">The declined payment won’t complete by itself. After the change applies, you’d need to check out again.</p>
      <button className="btn primary block" onClick={submit}>{delayed ? `Schedule increase to ${$(target)}` : `Raise budget to ${$(target)}`}</button>
      <button className="btn secondary block" onClick={() => replace('leave', { r })}>Actually, leave it for now</button>
    </Sheet>
  );
}

function CaptureSheet({ ctx, holdId }) {
  const { state, now, act, close } = ctx;
  const h = state.holds.find(x => x.id === holdId);
  const [amount, setAmount] = useState(h ? centsToInput(h.amountCents) : '');
  if (!h || h.status !== 'pending') return <Sheet title="Capture" onClose={close}><p className="muted">This hold is already settled.</p></Sheet>;
  const cents = E.toCents(amount);
  return (
    <Sheet title="Merchant captures" onClose={close} footer={<button className="btn primary block" disabled={!cents} onClick={() => { if (act(s => E.captureHold(s, holdId, cents, now), x => x.releasedCents ? `Captured. ${$(x.releasedCents)} of the hold was released.` : x.overCaptureCents ? `Captured ${$(x.overCaptureCents)} more than authorized.` : 'Captured. It now counts as completed spending.')) close(); }}>Capture {cents ? $(cents) : ''}</button>}>
      <p className="muted">The merchant settles the {$(h.amountCents)} authorization. The hold becomes completed spending in the period it was authorized, {fmtDay(h.createdAt)}.</p>
      <MoneyInput id="cap-amt" label="Captured amount" value={amount} onChange={setAmount} hint="Less than the hold releases the rest. More is possible for tips or final weights: card limits apply when a payment is authorized, not when it settles." />
    </Sheet>
  );
}

function RefundSheet({ ctx, spendId }) {
  const { state, now, act, close } = ctx;
  const sp = state.spend.find(x => x.id === spendId);
  const remaining = sp ? sp.amountCents - E.refundedCents(state, sp.id) : 0;
  const [amount, setAmount] = useState(centsToInput(remaining));
  const cents = E.toCents(amount);
  return (
    <Sheet title="Record a refund" onClose={close} footer={<button className="btn primary block" disabled={!cents} onClick={() => { if (act(s => E.refundSpend(s, spendId, cents, now), `${$(cents)} refunded.`)) close(); }}>Refund {cents ? $(cents) : ''}</button>}>
      <p className="muted">{sp.note || 'Purchase'} · {$(sp.amountCents)} on {fmtDay(sp.occurredAt)}. Up to {$(remaining)} can still be refunded.</p>
      <p className="small muted">A refund restores allowance in the period of the original purchase. A refund of last month’s purchase won’t add to this month.</p>
      <MoneyInput id="rf-amt" label="Refund amount" value={amount} onChange={setAmount} />
    </Sheet>
  );
}

/* ================= SHIELD ================= */
function ShieldSheet({ ctx, envId }) {
  const { state, now, act, close } = ctx;
  const sum = E.envelopeSummary(state, envId, now);
  const goal = E.goalSummary(state, now);
  const p = E.progress(state, now);
  const [phase, setPhase] = useState('shield');
  const [label, setLabel] = useState('');
  const [amount, setAmount] = useState('');
  const m = sum.merchant.name;
  if (sum.rules.mode !== 'access') {
    return (
      <Sheet title="Shopping shield" onClose={close}>
        <p className="muted">The {m} envelope uses {MODE[sum.rules.mode].label.toLowerCase()}, so opening {m} isn’t shielded.</p>
        <p className="small muted">{sum.rules.mode === 'payment' ? 'You can use payment restriction and a shield together in the full product. This prototype shows one mode per envelope to keep the differences clear.' : 'Switch this envelope to shopping access restriction in Edit rules to preview the shield.'}</p>
        <button className="btn secondary" onClick={() => ctx.replace('editor', { id: envId })}>Edit rules</button>
      </Sheet>
    );
  }
  return (
    <Sheet title="Shield preview" onClose={close}>
      {phase === 'shield' && (<>
        <p className="tiny">What you’d see opening the {m} app or {sum.merchant.domain || 'its website'} on iPhone.</p>
        <div className="shield">
          <div className="sicon"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#CFE2DF" strokeWidth="1.6"><path d="M9 6v12M15 6v12" strokeLinecap="round" /></svg></div>
          <h3>{m} is paused</h3>
          <p>{$(sum.availableCents)} left this {sum.cadence === 'weekly' ? 'week' : 'month'}. You’ve waited {p.interventions.shieldsWaited} times.{goal ? ` ${goal.name}: ${$(goal.reportedCents, true)} of ${$(goal.targetCents, true)}.` : ''}</p>
          <button className="sbtn p" onClick={() => { act(s => E.recordShield(s, { envelopeId: envId, outcome: 'waited' }, now)); setPhase('waited'); }}>I’ll wait</button>
          <button className="sbtn s" onClick={() => { act(s => E.recordShield(s, { envelopeId: envId, outcome: 'unlocked' }, now)); setPhase('unlocked'); }}>I still want to look</button>
        </div>
        <p className="tiny">On iPhone, a Screen Time shield is a system screen with a few settable parts: icon, title, short text, colors and up to two buttons. It can’t show what’s in your cart; Arca never sees inside other apps.</p>
      </>)}
      {phase === 'waited' && (<>
        <div className="card soft"><p style={{ fontFamily: 'var(--display)', fontSize: 20 }}>You closed {m} before browsing.</p><p className="small">That counts as a shopping intervention. No amount is attached, because opening an app doesn’t say what you would have spent.</p></div>
        <p className="small muted">If you had something specific in mind, you can note it as a skipped purchase. This is optional.</p>
        <TextField id="sh-label" label="What were you going to buy?" value={label} onChange={setLabel} placeholder="e.g. Throw pillows" />
        <MoneyInput id="sh-amt" label="Rough price (optional)" value={amount} onChange={setAmount} />
        <button className="btn primary block" disabled={!label.trim()} onClick={() => { if (act(s => E.recordForgone(s, { envelopeId: envId, merchantId: sum.env.merchantId, label, amountCents: amount ? E.toCents(amount) : null, source: 'shield' }, now), 'Noted as a purchase you skipped.')) close(); }}>Save skipped purchase</button>
        <button className="btn secondary block" onClick={close}>Done</button>
      </>)}
      {phase === 'unlocked' && (<>
        <div className="card flat"><p className="h3">{m} opens for 10 minutes</p><p className="small muted">The full app would lift the shield, then put it back with a scheduled timer. A notification would invite you back to Arca afterwards, because a shield can’t open Arca directly.</p></div>
        <p className="small muted">This is recorded as an intervention you chose to pass. That’s fine. The record is for your own picture, not a score.</p>
        <button className="btn primary block" onClick={close}>Done</button>
      </>)}
    </Sheet>
  );
}

/* ================= LOG / WISHLIST / REFLECT / GOAL ================= */
function SpendSheet({ ctx, envId }) {
  const { state, now, act, close } = ctx;
  const envs = E.activeEnvelopes(state, now);
  const [eid, setEid] = useState(envId || (envs[0] ? envs[0].id : ''));
  const [amount, setAmount] = useState('');
  const [when, setWhen] = useState(0);
  const [note, setNote] = useState('');
  const cents = E.toCents(amount);
  const sum = eid ? E.envelopeSummary(state, eid, now) : null;
  const occurredAt = when === 0 ? now : E.startOfDay(now) - when * E.DAY + 12 * E.HOUR;
  const save = () => {
    const r = act(s => E.addManualSpend(s, { envelopeId: eid, amountCents: cents, occurredAt, note }, now));
    if (!r) return;
    const after = E.envelopeSummary(ctx.stateRef.current, eid, now);
    if (after.overCents > 0) { act(s => E.recordNudge(s, eid, now)); ctx.notify(`Logged. ${after.merchant.name} is ${$(after.overCents)} past its budget this period.`); }
    else ctx.notify(`Logged. ${$(after.availableCents)} left for ${after.merchant.name}.`);
    close();
  };
  if (!envs.length) return <Sheet title="Log spending" onClose={close}><p className="muted">Create an envelope first.</p></Sheet>;
  return (
    <Sheet title="Log spending" onClose={close} footer={<button className="btn primary block" disabled={!cents} onClick={save}>Log {cents ? $(cents) : 'purchase'}</button>}>
      <div className="field"><span>Envelope</span>
        <div className="pills">{envs.map(e => <button key={e.id} type="button" className="pill" aria-pressed={eid === e.id} onClick={() => setEid(e.id)}>{E.findMerchant(state, e.merchantId).name}</button>)}</div>
        {sum && <small>{$(sum.availableCents)} available{when > 0 ? ' now; an older date counts toward the period it falls in' : ''}</small>}
      </div>
      <MoneyInput id="ls-amt" label="Amount" value={amount} onChange={setAmount} />
      <div className="field"><span>When</span><Seg label="When" value={when} onChange={setWhen} options={[{ value: 0, label: 'Today' }, { value: 1, label: 'Yesterday' }, { value: 2, label: '2 days ago' }]} /></div>
      <TextField id="ls-note" label="Note (optional)" value={note} onChange={setNote} placeholder="e.g. Groceries" />
      <p className="tiny">Manual entries count right away. Bank syncing is planned for later. Bank data usually arrives minutes to days after a purchase, so it can update your picture but can’t stop a payment.</p>
    </Sheet>
  );
}

function WishlistSheet({ ctx }) {
  const { state, now, act, close } = ctx;
  const [label, setLabel] = useState('');
  const [price, setPrice] = useState('');
  const [mid, setMid] = useState('');
  const [buying, setBuying] = useState(null);
  const [logIt, setLogIt] = useState(true);
  const waiting = state.wishlist.filter(w => w.status === 'waiting').sort((a, b) => a.revisitAt - b.revisitAt);
  const past = state.wishlist.filter(w => w.status !== 'waiting').slice(-6).reverse();
  const envFor = id => E.activeEnvelopes(state, now).find(e => e.merchantId === id);
  const add = () => {
    const env = envFor(mid);
    const r = act(s => E.addWish(s, { label, merchantId: mid || null, envelopeId: env ? env.id : null, amountCents: price ? E.toCents(price) : null }, now));
    if (r) { setLabel(''); setPrice(''); ctx.notify(`Added. Revisit it ${fmtDay(r.revisitAt)}.`); }
  };
  return (
    <Sheet title="Wishlist" onClose={close}>
      <p className="muted small">Things you want, given a week to settle. When the wait ends, buy it, keep waiting, or let it go. All three are fine.</p>
      {waiting.length === 0 && <p className="muted">Nothing waiting.</p>}
      {waiting.map(w => {
        const ready = w.revisitAt <= now;
        return (
          <div className="card flat" key={w.id}>
            <div className="row between"><div className="grow"><b>{w.label}</b><div className="tiny">{w.merchantId ? E.findMerchant(state, w.merchantId).name + ' · ' : ''}added {relDay(w.addedAt, now)}</div></div>{w.amountCents !== null && <span className="amt tnum">{$(w.amountCents)}</span>}</div>
            <span className={'chip ' + (ready ? 'teal' : '')} style={{ alignSelf: 'flex-start' }}>{ready ? 'Ready to revisit' : `Waiting until ${fmtDay(w.revisitAt)}`}</span>
            {buying === w.id ? (
              <div className="stack">
                {w.envelopeId && w.amountCents ? <Toggle checked={logIt} onChange={setLogIt} label={`Log ${$(w.amountCents)} as spending`} sub="Counts toward its envelope today." /> : <p className="tiny">No envelope or price attached, so nothing is logged.</p>}
                <div className="row"><button className="btn sm primary" onClick={() => { if (act(s => E.resolveWish(s, w.id, 'bought', now, { logSpend: logIt }), 'Marked as bought.')) setBuying(null); }}>Confirm</button><button className="btn sm secondary" onClick={() => setBuying(null)}>Back</button></div>
              </div>
            ) : (
              <div className="row wrap">
                <button className="btn sm secondary" onClick={() => setBuying(w.id)}>{ready ? 'Buy it' : 'Buy anyway'}</button>
                <button className="btn sm secondary" onClick={() => act(s => E.resolveWish(s, w.id, 'removed', now), ready ? 'Let go. You waited it out.' : 'Removed.')}>Let it go</button>
                {ready && <button className="btn sm ghost" onClick={() => act(s => E.resolveWish(s, w.id, 'waiting', now), 'Waiting another week.')}>Wait a week more</button>}
              </div>
            )}
          </div>
        );
      })}
      <div className="card soft">
        <p className="h3">Add something you’re considering</p>
        <TextField id="wl-label" label="Item" value={label} onChange={setLabel} placeholder="e.g. Rain jacket" />
        <MoneyInput id="wl-price" label="Price (optional)" value={price} onChange={setPrice} />
        <div className="field"><span>Shop (optional)</span><select id="wl-m" className="input" value={mid} onChange={e => setMid(e.target.value)}><option value="">Not sure yet</option>{state.merchants.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></div>
        <button className="btn primary" disabled={!label.trim()} onClick={add}>Add with a 7-day wait</button>
      </div>
      {past.length > 0 && (
        <div className="stack"><p className="eyebrow">Decided</p>
          <div className="list">{past.map(w => <div className="li" key={w.id}><div className="grow">{w.label}<div className="sub">{w.status === 'bought' ? 'Bought' : 'Let go'} {relDay(w.resolvedAt, now)}{w.afterCoolingOff ? ' · after the wait' : ''}</div></div>{w.amountCents !== null && <span className="amt muted">{$(w.amountCents)}</span>}</div>)}</div>
        </div>
      )}
    </Sheet>
  );
}

function ReflectSheet({ ctx }) {
  const { now, act, close } = ctx;
  const [prompt, setPrompt] = useState(REFLECT_PROMPTS[0]);
  const [text, setText] = useState('');
  return (
    <Sheet title="Reflect" onClose={close} footer={<button className="btn primary block" disabled={!text.trim()} onClick={() => { if (act(s => E.addReflection(s, { text, prompt }, now), 'Saved. Thank you for taking a minute.')) close(); }}>Save reflection</button>}>
      <p className="muted small">Optional and private. A sentence is plenty.</p>
      <div className="pills">{REFLECT_PROMPTS.map(p => <button key={p} type="button" className="pill" style={{ fontSize: 13 }} aria-pressed={prompt === p} onClick={() => setPrompt(p)}>{p}</button>)}</div>
      <p style={{ fontFamily: 'var(--display)', fontSize: 20 }}>{prompt}</p>
      <textarea id="rf-text" className="input" value={text} onChange={e => setText(e.target.value)} maxLength={400} placeholder="Write freely." />
    </Sheet>
  );
}

function GoalSheet({ ctx }) {
  const { state, now, act, close } = ctx;
  const g = state.goal;
  const [name, setName] = useState(g ? g.name : '');
  const [target, setTarget] = useState(g ? centsToInput(g.targetCents) : '');
  const [months, setMonths] = useState(g && g.byDate ? Math.max(1, Math.round((g.byDate - now) / (30 * E.DAY))) : 6);
  const cents = E.toCents(target);
  const save = () => {
    const d = new Date(now); const by = new Date(d.getFullYear(), d.getMonth() + months, 1).getTime();
    if (act(s => E.setGoal(s, { name, targetCents: cents, byDate: by, keepReported: true }, now), 'Goal saved.')) close();
  };
  return (
    <Sheet title={g ? 'Edit goal' : 'Set a goal'} onClose={close} footer={<button className="btn primary block" disabled={!name.trim() || !cents} onClick={save}>Save goal</button>}>
      <TextField id="g-name" label="Saving toward" value={name} onChange={setName} placeholder="e.g. Lisbon in spring" maxLength={40} />
      <MoneyInput id="g-target" label="Target" value={target} onChange={setTarget} />
      <div className="field"><span>Aim to reach it in</span><Seg label="Timeframe" value={months} onChange={setMonths} options={[3, 6, 9, 12].map(n => ({ value: n, label: `${n} mo` }))} /></div>
      <p className="tiny">Transfers you’ve already recorded stay with the goal.</p>
    </Sheet>
  );
}

function SavingsSheet({ ctx }) {
  const { now, act, close } = ctx;
  const [amount, setAmount] = useState('');
  const cents = E.toCents(amount);
  return (
    <Sheet title="Record a transfer" onClose={close} footer={<button className="btn primary block" disabled={!cents} onClick={() => { if (act(s => E.reportSavings(s, cents, now), 'Recorded as self-reported savings.')) close(); }}>Record {cents ? $(cents) : ''}</button>}>
      <p className="muted">Record money you moved into savings yourself. Arca can’t see your bank in this prototype, so it’s marked as self-reported.</p>
      <MoneyInput id="sv-amt" label="Amount moved" value={amount} onChange={setAmount} />
      <p className="tiny">A future bank connection could show verified deposits separately. Skipped purchases aren’t added here automatically, because not spending money doesn’t put it in savings.</p>
    </Sheet>
  );
}

/* ================= PROGRESS ================= */
function Progress({ ctx }) {
  const { state, now, act } = ctx;
  const p = E.progress(state, now);
  const ms = E.milestones(state, now);
  const sums = E.activeEnvelopes(state, now).map(e => E.envelopeSummary(state, e.id, now));
  const maxB = Math.max(1, ...sums.map(x => Math.max(x.budgetCents, x.completedCents + x.pendingCents)));
  const forgone = state.forgone.slice().reverse();
  const recent = state.attempts.filter(a => a.at <= now).slice(-8).reverse();
  return (
    <div className="pad screen-in">
      <div className="stack" style={{ paddingTop: 8 }}>
        <p className="eyebrow">Progress</p>
        <h1 className="display">What you’ve kept to</h1>
        <p className="muted">Each number below measures something different, so they’re kept apart rather than added into one savings figure.</p>
      </div>

      <div className="card">
        <div className="row between"><p className="h3">Days within budget</p><span className="chip teal">{p.days.streak}-day streak</span></div>
        <div className="row" style={{ alignItems: 'baseline', gap: 8 }}><span className="big-num">{p.days.within}</span><span className="muted">of {p.days.total} days</span></div>
        <p className="tiny">A day counts when every envelope’s completed spending is at or under its budget at the end of the day.</p>
      </div>

      <div className="card">
        <p className="h3">Completed spending this period</p>
        <div className="row" style={{ alignItems: 'baseline', gap: 8 }}><span className="big-num">{$(p.completed.periodCents)}</span><span className="muted small">+ {$(p.completed.pendingCents)} pending</span></div>
        <div className="stack">
          {sums.map(x => (
            <div key={x.id} className="stack" style={{ gap: 4 }}>
              <div className="row between small"><span>{x.merchant.name}</span><span className="tnum muted">{$(x.completedCents)} / {$(x.budgetCents, true)}</span></div>
              <div style={{ width: (Math.max(x.budgetCents, x.completedCents + x.pendingCents) / maxB * 100) + '%' }}><Bar budget={x.budgetCents} completed={x.completedCents} pending={x.pendingCents} /></div>
            </div>
          ))}
        </div>
        <p className="tiny">All time: {$(p.completed.allTimeCents)} after refunds.</p>
      </div>

      <div className="card">
        <p className="h3">Shopping interventions</p>
        <span className="big-num">{p.interventions.total}</span>
        <div className="stats">
          <div className="stat"><b>{p.interventions.shields}</b><span>Shield screens ({p.interventions.shieldsWaited} waited)</span></div>
          <div className="stat"><b>{p.interventions.declines}</b><span>Checkout declines</span></div>
          <div className="stat"><b>{p.interventions.nudges}</b><span>Over-budget reminders</span></div>
        </div>
        <p className="tiny">A shield screen has no amount, because opening an app doesn’t say what you would have spent.</p>
      </div>

      <div className="card">
        <p className="h3">Declined purchase attempts</p>
        <span className="big-num">{$(p.declined.valueCents)}</span>
        <p className="small muted">{p.declined.uniqueCount} unique purchase{p.declined.uniqueCount === 1 ? '' : 's'} from {p.declined.attemptCount} attempt{p.declined.attemptCount === 1 ? '' : 's'}. Retries of the same purchase within a day count once, and purchases approved after a budget change drop out.</p>
        <p className="tiny">A declined payment isn’t proof of savings. The same thing could be bought another way, or later.</p>
      </div>

      <div className="card">
        <p className="h3">Purchases you chose to skip</p>
        <div className="row" style={{ alignItems: 'baseline', gap: 8 }}><span className="big-num">{$(p.forgone.valueCents)}</span><span className="muted small">you reported{p.forgone.unknownAmountCount ? ` · ${p.forgone.unknownAmountCount} without a price` : ''}</span></div>
        <div className="list">
          {forgone.map(f => (
            <div className="li" key={f.id}>
              <div className="grow"><div className={f.status === 'bought_later' ? 'strike' : ''}>{f.label}</div><div className="sub">{relDay(f.at, now)} · {f.source === 'shield' ? 'after a shield' : f.source === 'decline' ? 'after a decline' : 'noted by you'}{f.status === 'bought_later' ? ' · bought later' : ''}</div></div>
              <span className="amt">{f.amountCents !== null ? $(f.amountCents) : '—'}</span>
              <button className="btn sm secondary" onClick={() => act(s => E.setForgoneStatus(s, f.id, f.status === 'forgone' ? 'bought_later' : 'forgone', now), f.status === 'forgone' ? 'Marked as bought later. It no longer counts as skipped.' : 'Marked as skipped again.')}>{f.status === 'forgone' ? 'Bought later' : 'Undo'}</button>
            </div>
          ))}
          {forgone.length === 0 && <p className="muted small">Nothing yet.</p>}
        </div>
      </div>

      <div className="card flat">
        <div className="row between"><p className="h3">Verified savings deposits</p><span className="chip">Not connected</span></div>
        <p className="small muted">This would come from a future bank connection that can confirm money arrived in savings. Until then, only your self-reported transfers ({p.goal ? $(p.goal.reportedCents) : '$0'}) appear on Home.</p>
      </div>

      <div className="card">
        <p className="h3">Milestones</p>
        <div>{ms.map(m => (
          <div key={m.id} className={'mile ' + (m.done ? 'done' : '')}>
            <span className="m">{m.done ? <span style={{ width: 16 }}><Icon name="check" /></span> : <span style={{ width: 8, height: 8, borderRadius: 8, background: 'var(--line)' }} />}</span>
            <div className="grow"><b>{m.title}</b><div className="small muted">{m.detail}</div>{!m.done && m.progress && <div className="tiny">{m.progress}</div>}</div>
          </div>))}</div>
      </div>

      {state.reflections.length > 0 && (
        <div className="card">
          <p className="h3">Your reflections</p>
          {state.reflections.slice().reverse().slice(0, 4).map(r => (
            <div key={r.id} className="stack" style={{ gap: 2 }}><span className="tiny">{relDay(r.at, now)} · {r.prompt}</span><p style={{ fontFamily: 'var(--display)', fontSize: 17 }}>“{r.text}”</p></div>
          ))}
        </div>
      )}

      <details className="fold card flat">
        <summary>Recent card activity (demo)</summary>
        <div className="list" style={{ marginTop: 8 }}>{recent.map(a => (
          <div className="li" key={a.id}><div className="grow">{a.note || 'Purchase'} · {E.findMerchant(state, a.merchantId).name}<div className="sub">{relDay(a.at, now)} {fmtTime(a.at)}{a.isRetry ? ' · retry' : ''}</div></div>
            <span className={'chip ' + (a.decision === 'approved' ? 'teal' : 'stop')}>{a.decision === 'approved' ? 'Approved' : 'Declined'}</span><span className="amt">{$(a.amountCents)}</span></div>))}</div>
      </details>
    </div>
  );
}

/* ================= SETTINGS ================= */
function Settings({ ctx }) {
  const { state, now, act, open, notify } = ctx;
  const [tests, setTests] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const [name, setName] = useState(state.profile.name || '');
  const offset = state.clockOffsetMs || 0;
  const shift = ms => act(s => ({ state: { ...s, clockOffsetMs: (s.clockOffsetMs || 0) + ms } }), ms ? 'Demo clock moved forward.' : null);
  const pass = tests ? tests.filter(t => t.pass).length : 0;
  return (
    <div className="pad screen-in">
      <div className="stack" style={{ paddingTop: 8 }}><p className="eyebrow">Settings</p><h1 className="display">Your setup</h1></div>

      <div className="card">
        <div className="field"><span><label htmlFor="st-name">Name used in greetings</label></span>
          <div className="row"><input id="st-name" className="input grow" value={name} maxLength={30} onChange={e => setName(e.target.value)} /><button className="btn sm secondary" onClick={() => act(s => ({ state: { ...s, profile: { ...s.profile, name: name.trim() } } }), 'Saved.')}>Save</button></div>
        </div>
        <button className="btn secondary" onClick={() => open('goal')}>Edit savings goal</button>
      </div>

      <div className="card">
        <div className="row between"><p className="h3">Demo clock</p>{offset > 0 && <span className="chip warn">Ahead of real time</span>}</div>
        <p className="small muted">Now in the demo: <b>{fmtWhen(now)}</b>. Move time forward to watch cooling-off periods end, holds age and budgets reset.</p>
        <div className="row wrap">
          <button className="btn sm secondary" onClick={() => shift(E.HOUR * 12)}>+12 hours</button>
          <button className="btn sm secondary" onClick={() => shift(E.DAY)}>+1 day</button>
          <button className="btn sm secondary" onClick={() => shift(E.DAY * 3)}>+3 days</button>
          <button className="btn sm secondary" onClick={() => shift(E.DAY * 7)}>+1 week</button>
          {offset > 0 && <button className="btn sm ghost" onClick={() => act(s => ({ state: { ...s, clockOffsetMs: 0 } }), 'Back to real time. Changes made in the future stay in the ledger with their future dates.')}>Back to real time</button>}
        </div>
      </div>

      <div className="card">
        <p className="h3">Connections</p>
        <div className="list">
          <div className="li"><div className="grow">Screen Time access<div className="sub">Simulated. The iPhone app asks for permission and lets you pick apps and sites.</div></div><span className="chip">Simulated</span></div>
          <div className="li"><div className="grow">Bank transactions<div className="sub">Planned for later, through a data provider. Not available in this prototype.</div></div><span className="chip">Unavailable</span></div>
          <div className="li"><div className="grow">Envelope cards<div className="sub">Phase 2, pending a card program partner and bank approval.</div></div><span className="chip demo">Demo only</span></div>
          <div className="li"><div className="grow">Notifications<div className="sub">Browsers can’t show iPhone notifications here. Gentle reminders appear inside the app instead.</div></div><span className="chip">Unavailable</span></div>
        </div>
      </div>

      <div className="card">
        <div className="row between"><p className="h3">Engine checks</p>{tests && <span className={'chip ' + (pass === tests.length ? 'teal' : 'stop')}>{pass}/{tests.length} passing</span>}</div>
        <p className="small muted">Runs the budget and restriction rules against fixed test cases, separate from your demo data.</p>
        <button className="btn secondary" onClick={() => setTests(E.runSelfTests())}>{tests ? 'Run again' : 'Run checks'}</button>
        {tests && <div>{tests.map(t => (
          <div className="test-row" key={t.name}><span className="dotok" style={{ background: t.pass ? 'var(--ok)' : 'var(--stop)' }}>{t.pass ? '✓' : '!'}</span><div className="grow">{t.name}{t.error && <div className="tiny" style={{ color: 'var(--stop)' }}>{t.error}</div>}</div></div>
        ))}</div>}
      </div>

      <div className="card">
        <p className="h3">Demo data</p>
        <p className="small muted">Your changes are saved in this browser only.</p>
        <button className="btn secondary" onClick={() => act(s => ({ state: { ...s, onboarded: false } }))}>Replay onboarding</button>
        {!confirmReset ? <button className="btn danger" onClick={() => setConfirmReset(true)}>Reset demo data</button> : (
          <div className="card warnc"><p className="small">This replaces everything with fresh sample data and restarts onboarding.</p>
            <div className="row"><button className="btn sm primary" onClick={() => { ctx.setState(E.seedDemoState(Date.now())); setConfirmReset(false); notify('Demo data reset.'); }}>Reset</button><button className="btn sm secondary" onClick={() => setConfirmReset(false)}>Cancel</button></div></div>
        )}
      </div>

      <details className="fold card flat">
        <summary>What’s simulated in this prototype</summary>
        <div className="stack small muted" style={{ marginTop: 10 }}>
          <p><b>Simulated:</b> card authorizations, holds, captures, releases and refunds; Screen Time shields; savings deposits; notifications. All merchants, people and amounts are fictional.</p>
          <p><b>Working for real, inside this page:</b> the budget engine, envelope rules, cooling-off timing, duplicate-attempt handling and progress math, all in whole cents.</p>
          <p><b>Not attempted:</b> reading other apps or checkout pages, bank logins, moving money, issuing cards.</p>
          <p>People can still pay with another card, device or shop. Arca helps you keep a decision you made. It can’t make spending elsewhere impossible.</p>
        </div>
      </details>
    </div>
  );
}

/* ================= ONBOARDING ================= */
const FOCUS = ['Online shopping', 'Food delivery', 'Clothing', 'Home decor', 'Gadgets', 'Beauty', 'Late-night browsing', 'Subscriptions'];
function Onboarding({ ctx }) {
  const { state, now, act } = ctx;
  const [step, setStep] = useState(0);
  const [name, setName] = useState('');
  const [focus, setFocus] = useState([]);
  const [goalName, setGoalName] = useState('');
  const [goalTarget, setGoalTarget] = useState('');
  const [months, setMonths] = useState(6);
  const [picked, setPicked] = useState([]);
  const [customName, setCustomName] = useState('');
  const [mode, setMode] = useState('payment');
  const [first, setFirst] = useState('');
  const [cadence, setCadence] = useState('monthly');
  const [budget, setBudget] = useState('100');
  const [commitment, setCommitment] = useState(true);
  const [cooling, setCooling] = useState(48);
  const merchants = state.merchants.filter(m => !m.custom || m.id === 'hearth');
  const options = [...merchants.map(m => ({ id: m.id, name: m.name })), ...(customName.trim() ? [{ id: '__custom', name: customName.trim() }] : [])];
  const pickedOpts = options.filter(o => picked.includes(o.id));
  const firstId = picked.includes(first) ? first : (picked[0] || '');
  const toggle = (arr, set, v) => set(arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]);
  const steps = 6;
  const valid = [true, focus.length > 0, goalName.trim() && E.toCents(goalTarget) > 0, picked.length > 0, true, E.toCents(budget) > 0][step];
  const finish = () => {
    const d = new Date(now);
    const r = act(s => E.completeOnboarding(s, {
      name, focus,
      goal: { name: goalName.trim(), targetCents: E.toCents(goalTarget), byDate: new Date(d.getFullYear(), d.getMonth() + months, 1).getTime() },
      envelope: { merchantId: firstId === '__custom' ? null : firstId, customName: firstId === '__custom' ? customName.trim() : null, cadence, budgetCents: E.toCents(budget), mode, commitment, coolingHours: cooling }
    }, now));
    if (r) { ctx.setTab('home'); ctx.notify('Your first envelope is ready.'); }
  };
  const skip = () => act(s => ({ state: { ...s, onboarded: true } }), 'Exploring with sample data. Replay onboarding from Settings.');
  const firstName = (options.find(o => o.id === firstId) || {}).name || 'this shop';
  return (
    <div className="onb">
      <div className="onb-top">
        <div className="dots" aria-label={`Step ${step + 1} of ${steps}`}>{Array.from({ length: steps }).map((_, i) => <i key={i} className={i <= step ? 'on' : ''} />)}</div>
        <button className="link" onClick={skip}>Skip</button>
      </div>
      <div className="onb-body" key={step}>
        {step === 0 && (<>
          <div className="onb-hero"><div className="hero-glow" /><Hills /></div>
          <p className="eyebrow">Arca · Latin for a chest, a place for safekeeping</p>
          <h1 className="display">Keep the spending decisions you make in advance.</h1>
          <p className="muted">You choose a budget for the shops that pull you in. When a moment of wanting arrives, Arca gives you room to decide, and stands by the plan you made.</p>
          <TextField id="ob-name" label="What should we call you? (optional)" value={name} onChange={setName} placeholder="First name" maxLength={30} />
          <p className="tiny">This is a prototype with fictional sample data. No bank details are requested and no money moves.</p>
        </>)}
        {step === 1 && (<>
          <h1 className="title">What would you like to spend less on?</h1>
          <p className="muted">Pick any that fit. This shapes your suggestions, nothing else.</p>
          <div className="pills">{FOCUS.map(f => <button key={f} type="button" className="pill" aria-pressed={focus.includes(f)} onClick={() => toggle(focus, setFocus, f)}>{f}</button>)}</div>
        </>)}
        {step === 2 && (<>
          <h1 className="title">What are you saving toward?</h1>
          <p className="muted">A clear reason makes a pause easier to keep.</p>
          <TextField id="ob-goal" label="Goal" value={goalName} onChange={setGoalName} placeholder="e.g. Lisbon in spring" maxLength={40} />
          <MoneyInput id="ob-target" label="Target amount" value={goalTarget} onChange={setGoalTarget} />
          <div className="field"><span>Aim to reach it in</span><Seg label="Timeframe" value={months} onChange={setMonths} options={[3, 6, 9, 12].map(n => ({ value: n, label: `${n} mo` }))} /></div>
          <p className="tiny">This is a target. Arca counts money toward it only when you record moving it to savings.</p>
        </>)}
        {step === 3 && (<>
          <h1 className="title">Which shops pull you in?</h1>
          <p className="muted">You’ll start with one envelope and can add the rest any time.</p>
          <div className="pills">{options.map(o => <button key={o.id} type="button" className="pill" aria-pressed={picked.includes(o.id)} onClick={() => toggle(picked, setPicked, o.id)}>{o.name}</button>)}</div>
          <TextField id="ob-custom" label="Another shop" value={customName} onChange={v => { setCustomName(v); if (v.trim() && !picked.includes('__custom')) setPicked([...picked, '__custom']); if (!v.trim()) setPicked(picked.filter(x => x !== '__custom')); }} placeholder="Type a name to add it" maxLength={40} />
        </>)}
        {step === 4 && (<>
          <h1 className="title">Three ways Arca can step in</h1>
          <p className="muted">They get firmer as you go down. Choose one for your first envelope.</p>
          {['reminder', 'access', 'payment'].map((k, i) => (
            <button key={k} type="button" className="choice" aria-pressed={mode === k} onClick={() => setMode(k)}>
              <span className="eyebrow" style={{ color: 'var(--teal-ink)' }}>{['Notice', 'Friction', 'Enforcement'][i]}</span>
              <b>{MODE[k].label}</b><span>{MODE[k].desc}</span>
            </button>
          ))}
          <p className="tiny">None of these can stop you paying with another card, device or shop. They make your own plan easier to keep.</p>
        </>)}
        {step === 5 && (<>
          <h1 className="title">Your first envelope</h1>
          {pickedOpts.length > 1 && <div className="pills">{pickedOpts.map(o => <button key={o.id} type="button" className="pill" aria-pressed={firstId === o.id} onClick={() => setFirst(o.id)}>{o.name}</button>)}</div>}
          <div className="field"><span>Resets</span><Seg label="Cadence" value={cadence} onChange={setCadence} options={[{ value: 'weekly', label: 'Weekly' }, { value: 'monthly', label: 'Monthly' }]} /></div>
          <MoneyInput id="ob-budget" label={`${firstName} budget per ${cadence === 'weekly' ? 'week' : 'month'}`} value={budget} onChange={setBudget} />
          <div className="card flat">
            <Toggle checked={commitment} onChange={setCommitment} label="Commitment mode" sub="Loosening this envelope later will wait out a cooling-off period." />
            {commitment && <Seg label="Cooling-off" value={cooling} onChange={setCooling} options={[24, 48, 72].map(h => ({ value: h, label: `${h}h` }))} />}
          </div>
          <div className="card soft"><p className="small">{firstName}: {E.toCents(budget) ? $(E.toCents(budget)) : '—'} per {cadence === 'weekly' ? 'week' : 'month'}, {MODE[mode].label.toLowerCase()}{commitment ? `, with a ${cooling}-hour cooling-off before raising it` : ''}. Lowering it always applies right away.</p></div>
        </>)}
      </div>
      <div className="onb-foot">
        {step > 0 && <button className="btn secondary" onClick={() => setStep(step - 1)}>Back</button>}
        {step < steps - 1
          ? <button className="btn primary grow" disabled={!valid} onClick={() => setStep(step + 1)}>{step === 0 ? 'Begin' : 'Continue'}</button>
          : <button className="btn primary grow" disabled={!valid} onClick={finish}>Create envelope</button>}
      </div>
    </div>
  );
}

/* ================= APP SHELL ================= */
const SHEETS = { envelope: EnvelopeSheet, editor: EditorSheet, card: CardSheet, purchase: PurchaseSheet, leave: LeaveSheet, override: OverrideSheet, capture: CaptureSheet, refund: RefundSheet, shield: ShieldSheet, spend: SpendSheet, wishlist: WishlistSheet, reflect: ReflectSheet, goal: GoalSheet, savings: SavingsSheet };
const TABS = [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'envelopes', label: 'Envelopes', icon: 'env' }, { id: 'progress', label: 'Progress', icon: 'progress' }, { id: 'settings', label: 'Settings', icon: 'gear' }];

function App() {
  const [state, setStateRaw] = useState(() => loadState() || E.seedDemoState(Date.now()));
  const stateRef = useRef(state);
  const setState = s => { stateRef.current = s; setStateRaw(s); };
  const [realNow, setRealNow] = useState(Date.now());
  useEffect(() => { const i = setInterval(() => setRealNow(Date.now()), 20000); return () => clearInterval(i); }, []);
  useEffect(() => { saveState(state); }, [state]);
  const now = realNow + (state.clockOffsetMs || 0);
  const [tab, setTabRaw] = useState(() => { try { return localStorage.getItem(TAB_KEY) || 'home'; } catch (e) { return 'home'; } });
  const setTab = t => { setTabRaw(t); try { localStorage.setItem(TAB_KEY, t); } catch (e) {} };
  const [stack, setStack] = useState([]);
  const [toast, setToast] = useState(null);
  const screenRef = useRef(null);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3600); return () => clearTimeout(t); }, [toast]);
  useEffect(() => { if (screenRef.current) screenRef.current.scrollTop = 0; }, [tab]);

  const notify = msg => setToast({ msg, key: Math.random() });
  const act = (fn, msg) => {
    try {
      const out = fn(stateRef.current);
      setState(out.state);
      if (msg) notify(typeof msg === 'function' ? msg(out.result || {}) : msg);
      return out.result || {};
    } catch (e) { notify(e.message); return null; }
  };
  const open = (type, props) => setStack(st => [...st, { type, props: props || {}, key: Math.random() }]);
  const close = useCallback(() => setStack(st => st.slice(0, -1)), []);
  const replace = (type, props) => setStack(st => [...st.slice(0, -1), { type, props: props || {}, key: Math.random() }]);
  const ctx = { state, stateRef, now, act, open, close, replace, notify, setState, setTab };
  const top = stack[stack.length - 1];
  const SheetC = top ? SHEETS[top.type] : null;

  if (!state.onboarded) {
    return <div className="device"><div className="statusbar" /><Onboarding ctx={ctx} />{toast && <div className="toast" key={toast.key} role="status">{toast.msg}</div>}</div>;
  }
  return (
    <div className="device">
      <div className="statusbar" />
      <main className="screen" ref={screenRef}>
        {tab === 'home' && <Home ctx={ctx} />}
        {tab === 'envelopes' && <Envelopes ctx={ctx} />}
        {tab === 'progress' && <Progress ctx={ctx} />}
        {tab === 'settings' && <Settings ctx={ctx} />}
      </main>
      <nav className="tabbar" aria-label="Main">
        {TABS.map(t => <button key={t.id} className="tab" aria-current={tab === t.id ? 'page' : undefined} onClick={() => { setTab(t.id); setStack([]); }}><Icon name={t.icon} />{t.label}<span className="tab-dot" /></button>)}
      </nav>
      {SheetC && <SheetC key={top.key} ctx={ctx} {...top.props} />}
      {toast && <div className="toast" key={toast.key} role="status">{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  // Offline support once installed. Skipped where service workers aren't available.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
